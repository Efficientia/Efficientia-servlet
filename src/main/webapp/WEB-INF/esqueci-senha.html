<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efficientia - Área Restrita</title>
    <link rel="stylesheet" href="css/area-restrita.css">
</head>
<body>

    <div class="lateral-esquerda">
        <div class="logo-efficientia">
            <img src="../assets/logo_efficientia.png" alt="Logo Efficientia">
        </div>
    </div>
    
    <div class="menu-login">
        <h1 class="titulo-login">Alterar senha</h1>
        <form action="/alterar-senha" method="post"> <!-- mudar esse /alterar - senha para o caminho certo-->

            <div class="grupo-input">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>
            </div>

            <div class="grupo-input">
                <label for="senha">Senha Nova</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua nova senha" required>
            </div>
                        
            <p class="link-cadastro">Já possui uma conta?<a href="area-restrita.html">Faça login</a></p>
            
            <button type="submit">Entrar</button>

        </form>
    </div>

    

</body>
</html>
