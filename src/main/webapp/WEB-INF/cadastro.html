<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efficientia - Cadastro</title>
    <link rel="stylesheet" href="../css/area-restrita.css">
</head>
<body>
    <div class="conteudo">
        <div class="lateral-esquerda">
            <img class="logo-efficientia" src="../assets/logo_efficientia.png" alt="Logo Efficientia">
        </div>
        <div class="direita">
            <div class="menu-login">
                <form action="/cadastro" method="post">
                    <h1 class="titulo-login">Cadastrar</h1>

                <div class="grupo-input">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome" required>
                </div>


                <div class="grupo-input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                </div>
                
                <div class="grupo-input">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite uma senha" required>
                </div>
                
                <p class="link-cadastro">Já possui uma conta?<a href="area-restrita.html">Faça login</a></p>
                
                <button type="submit">Cadastrar</button>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
