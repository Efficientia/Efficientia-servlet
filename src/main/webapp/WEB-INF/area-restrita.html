<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efficientia - Área Restrita</title>
    <link rel="stylesheet" href="css/area-restrita.css">
</head>
<body>

    <div class="lateral-esquerda">
        <div class="logo-efficientia">
            <img src="../assets/logo_efficientia.png" alt="Logo Efficientia">
        </div>
    </div>
    
    <div class="menu-login">
        <h1 class="titulo-login">Entrar</h1>
        <form action="/login" method="post">

            <div class="grupo-input">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>

            <div class="grupo-input">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Senha" required>
            </div>
            
            <div class="esqueceu-senha">
                <a href="esqueci-senha.html">Esqueci minha senha</a>
            </div>
            
            <p class="link-cadastro">Não possui uma conta?<a href="cadastro.html">Crie uma</a></p>
            
            <button type="submit">Entrar</button>

        </form>
    </div>

    

</body>
</html>
